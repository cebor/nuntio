[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
nuntio-config = { path = "crates/nuntio-config" }
nuntio-render = { path = "crates/nuntio-render" }
nuntio-term = { path = "crates/nuntio-term" }

anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
winit = "0.30"
wgpu = "30"
pollster = "0.4"
lexopt = "0.3"
alacritty_terminal = "0.26"
cosmic-text = "0.19"
etagere = "0.3"
bytemuck = { version = "1", features = ["derive"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
