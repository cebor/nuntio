[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
# `cargo run` and friends at the root target the terminal, not the xtask.
default-members = ["crates/nuntio"]

[workspace.package]
version = "0.1.4"
edition = "2024"
# Checked in CI; the highest a dependency needs (sysinfo).
rust-version = "1.95"
license = "MIT OR Apache-2.0"
authors = ["Felix Itzenplitz <felitzn@gmail.com>"]
repository = "https://github.com/cebor/nuntio"
homepage = "https://cebor.github.io/nuntio/"

[workspace.dependencies]
nuntio-config = { path = "crates/nuntio-config" }
nuntio-render = { path = "crates/nuntio-render" }
nuntio-term = { path = "crates/nuntio-term" }
nuntio-config-tui = { path = "crates/nuntio-config-tui" }

anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
toml_edit = "0.25"
serde_ignored = "0.1"
notify = "8"
plist = "1"
dirs = "7"
winit = "0.30"
wgpu = "30"
pollster = "0.4"
lexopt = "0.3"
unicode-width = "0.2"
open = "5"
# File links: the local host name and %-escapes in paths.
gethostname = "1"
percent-encoding = "2"
alacritty_terminal = "0.26"
cosmic-text = "0.19"
fontdb = "0.23"
ratatui = "0.30"
etagere = "0.3"
bytemuck = { version = "1", features = ["derive"] }
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
sysinfo = { version = "0.39", default-features = false, features = ["system", "network"] }
starship-battery = "0.11"
# Process info on macOS (proc_pidinfo).
libc = "0.2"
windows-sys = { version = "0.61", features = ["Win32_Graphics_Dwm", "Win32_System_LibraryLoader"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
# Symbol names too, not only debug info (the default).
strip = "symbols"

# Debug builds of nuntio itself, with optimized dependencies: wgpu and
# cosmic-text are unbearably slow unoptimized.
[profile.dev.package."*"]
opt-level = 2
