[package]
name = "nuntio"
description = "A fast, GPU-rendered terminal emulator modeled on iTerm2"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["terminal", "terminal-emulator", "gpu", "wgpu", "tabs"]
categories = ["command-line-utilities"]
publish = false
# `nuntio-config` is the second binary.
default-run = "nuntio"

[[bin]]
name = "nuntio-config"
path = "src/bin/nuntio-config.rs"
# Its docs would overwrite those of the `nuntio-config` library.
doc = false

[dependencies]
nuntio-config.workspace = true
nuntio-render.workspace = true
nuntio-term.workspace = true
nuntio-config-tui.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
winit.workspace = true
lexopt.workspace = true
arboard.workspace = true
unicode-width.workspace = true
open.workspace = true
gethostname.workspace = true
percent-encoding.workspace = true
dirs.workspace = true
chrono.workspace = true
sysinfo.workspace = true
starship-battery.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[build-dependencies]
winresource = "0.1"

[lints]
workspace = true

[package.metadata.deb]
maintainer = "Felix Itzenplitz <felitzn@gmail.com>"
copyright = "2026, Felix Itzenplitz"
section = "x11"
priority = "optional"
# winit loads these at runtime (dlopen), so they aren't detected automatically.
depends = "$auto, libxkbcommon0, libwayland-client0, libwayland-cursor0, libxkbcommon-x11-0, libx11-6, libxcursor1, libxrandr2, libxi6"
recommends = "libvulkan1 | libegl1"
extended-description = "Terminal emulator with tabs, split panes, GPU rendering and a hot-reloaded TOML config."
# postinst/prerm register nuntio as x-terminal-emulator.
maintainer-scripts = "../../assets/deb/"
assets = [
    ["target/release/nuntio", "usr/bin/", "755"],
    # Only on the PATH inside nuntio's panes.
    ["target/release/nuntio-config", "usr/lib/nuntio/", "755"],
    ["../../assets/nuntio.desktop", "usr/share/applications/", "644"],
    ["../../assets/nuntio.metainfo.xml", "usr/share/metainfo/io.github.cebor.nuntio.metainfo.xml", "644"],
    ["../../assets/icon.svg", "usr/share/icons/hicolor/scalable/apps/nuntio.svg", "644"],
    ["../../assets/icons/png/16.png", "usr/share/icons/hicolor/16x16/apps/nuntio.png", "644"],
    ["../../assets/icons/png/32.png", "usr/share/icons/hicolor/32x32/apps/nuntio.png", "644"],
    ["../../assets/icons/png/48.png", "usr/share/icons/hicolor/48x48/apps/nuntio.png", "644"],
    ["../../assets/icons/png/64.png", "usr/share/icons/hicolor/64x64/apps/nuntio.png", "644"],
    ["../../assets/icons/png/128.png", "usr/share/icons/hicolor/128x128/apps/nuntio.png", "644"],
    ["../../assets/icons/png/256.png", "usr/share/icons/hicolor/256x256/apps/nuntio.png", "644"],
    ["../../assets/icons/png/512.png", "usr/share/icons/hicolor/512x512/apps/nuntio.png", "644"],
]
