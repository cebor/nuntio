# cargo-about: the license notices shipped as THIRD-PARTY-LICENSES.html in
# every package (`cargo xtask package`). Keep `accepted` in sync with
# `[licenses].allow` in deny.toml (a test in xtask checks it). Priority
# order: for `A OR B` crates the first one listed here is used.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "Unlicense",
]
# Not part of the shipped binaries.
ignore-build-dependencies = true
ignore-dev-dependencies = true
workarounds = ["ring"]
